# netlify.toml - Belims Vite project

[build]
  base = "app/public/frontend"       # Path to your Vite project root
  command = "npm run build"          # Production build command
  publish = "app/public/frontend/dist" # Folder generated by Vite

[functions]
  directory = "app/public/frontend/netlify/functions" # Optional, if using serverless functions

[build.environment]
  NODE_VERSION = "18"                       # Node version for build
  REACT_APP_WOO_SITE_URL = "https://your-live-wp-site.com"
  REACT_APP_WOO_CONSUMER_KEY = "ck_production_key"
  REACT_APP_WOO_CONSUMER_SECRET = "cs_production_key"
  REACT_APP_GEMINI_API_KEY = "your_production_gemini_key"

[dev]
  framework = "vite"
  port = 4173
