[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci --include=dev && npx vite build"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,REACT_APP_GEMINI_API_KEY,REACT_APP_WOO_SITE_URL"
  SECRETS_SCAN_OMIT_PATHS = "dist/**,services/**,.env*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true