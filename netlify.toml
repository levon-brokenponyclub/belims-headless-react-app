[build]
  base = "frontend"
  publish = "dist"
  command = "npm ci --include=dev && npm run build"

[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "development"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_GEMINI_API_KEY,REACT_APP_WOO_SITE_URL,NODE_ENV"
  SECRETS_SCAN_OMIT_PATHS = ".env,netlify-env-vars.env"

# WordPress API Proxy - bypasses CORS entirely
[[redirects]]
  from = "/api/*"
  to = "https://cms.belims.co.za/wp-json/:splat"
  status = 200
  force = true

# SPA fallback - must come AFTER API proxy
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true