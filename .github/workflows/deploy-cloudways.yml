name: Deploy WordPress to Cloudways

on:
  push:
    branches: [main]
    paths:
      - "wp-content/plugins/global-site-settings/**"
      - "wp-content/plugins/uafrica-shipping/**"
      - "wp-config.php"
      - ".github/workflows/deploy-cloudways.yml"

jobs:
  deploy:
    name: Deploy to Cloudways Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: |
          echo "Changed files:"
          git diff --name-only HEAD^..HEAD
          echo "files=$(git diff --name-only HEAD^..HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Deploy Global Site Settings Plugin
        if: contains(steps.changed-files.outputs.files, 'wp-content/plugins/global-site-settings')
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}
          user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          pass: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          localDir: "wp-content/plugins/global-site-settings/"
          remoteDir: "/public_html/wp-content/plugins/global-site-settings/"
          options: "--verbose --only-newer"

      - name: Deploy uAfrica Shipping Plugin
        if: contains(steps.changed-files.outputs.files, 'wp-content/plugins/uafrica-shipping')
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}
          user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          pass: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          localDir: "wp-content/plugins/uafrica-shipping/"
          remoteDir: "/public_html/wp-content/plugins/uafrica-shipping/"
          options: "--verbose --only-newer"

      - name: Deploy wp-config.php
        if: contains(steps.changed-files.outputs.files, 'wp-config.php')
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}
          user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          pass: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          localDir: "./"
          remoteDir: "/public_html/"
          options: "--verbose --include wp-config.php --exclude-glob *"

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌍 Site: https://wordpress-1482444-6163809.cloudwaysapps.com"
          echo "📦 Deployed plugins:"
          echo "${{ steps.changed-files.outputs.files }}" | grep "wp-content/plugins" || echo "No plugin changes"
