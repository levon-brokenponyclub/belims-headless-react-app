<!--
Option A — Industrial command centre (SELECTED) — full account: Dashboard, Orders (+ order detail), Addresses, Details, Wishlist. Payment methods tab removed.
In-page routes (hash): #dashboard #orders #order-<n> #addresses #details #wishlist. Real app routes: /account/:tab and NEW /account/orders/:orderNumber.
Components: AccountShell, AccountNav (links + aria-current), OrderStatusTracker, TrackingBlock, StatCard, RecentOrdersTable, QuickActions, OrdersList (+filters), OrderDetail, AddressCards, DetailsForm (labelled inputs, live region), WishlistGrid (stock-aware).
New data/API: order detail route; reorder (add by product id + stock check); default address saved server-side (PUT /users/me); invoice download endpoint (suggestion); 'ready to collect' signal; reset-password link via WP lost-password.
Decisions applied: keep R2,690.00 format; Payment tab removed; Account Balance deleted.
Build effort: MEDIUM-HIGH for the full set (shell + 5 views + order route; no new backend beyond reorder and default address).
AUDIT items addressed: fake Account Balance removed (real counts only); recent-order rows are links; order detail on its own URL; wishlist add disabled when out of stock; ZAR + en-ZA dates; labelled/semantic nav with aria-current; one radius scale / button system / status-badge system; focus-visible + reduced-motion; mobile no longer stacks a 7-item sidebar above content.
Mock states: toggle bottom-right (Default / Loading / Empty / Trade) or ?state=. All data inlined from data.json (anonymised). No network calls; buttons only show a toast.
-->

.stepper{display:grid;grid-template-columns:repeat(4,1fr);list-style:none;margin:0;padding:0}
.step{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;font-size:12px;font-weight:600;color:var(--faint);padding-inline:2px}
.step::before{content:"";position:absolute;top:13px;right:50%;width:100%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step-dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);font-size:12px;font-weight:700}

#statebar button{min-height:44px;min-width:44px;padding:0 10px;border-radius:var(--r-sm);background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);font:600 12px Archivo,system-ui;cursor:pointer}
#statebar button[aria-pressed=true]{background:#fff;color:#111}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:95;background:#111;color:#fff;padding:12px 18px;border-radius:var(--r-md);font-weight:600;max-width:calc(100vw - 32px);display:none}
#toast.show{display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
table{border-collapse:collapse;width:100%}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:left;font-weight:700;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--soft)}

const wishlistView=v=>{const items=v.wish.filter(w=>!LS.removed.has(w.id));return `<div class="space-y-4"><p id="wl-live" role="status" aria-live="polite" class="min-h-[24px] font-semibold text-[#27923b]">${esc(LS.msg)}</p>${items.length?`<ul class="grid gap-4 sm:grid-cols-2 xl:grid-cols-3">${items.map(w=>`<li class="card flex flex-col p-4"><div class="grid h-36 place-items-center bg-[#f5f5f5] text-[#6b6b6b]" style="border-radius:4px">${icon('tool',40)}</div><p class="mt-3 text-[12px] font-bold uppercase tracking-wider text-[#6b6b6b]">${esc(w.brand)}</p><h2 class="font-bold leading-snug">${esc(w.name)}</h2><p class="mt-1 text-[18px] font-bold">${money(w.price)}</p><p class="text-[14px] font-semibold ${w.stock?(w.stock<=3?'t-warn':'t-ok'):'t-err'}">${w.stock?(w.stock<=3?`Only ${w.stock} left`:'In stock'):'Out of stock'}</p><div class="mt-4 flex gap-3"><button class="btn btn-primary flex-1" type="button" ${w.stock?`data-add="${esc(w.name)}"`:'disabled'}>${w.stock?'Add to cart':'Unavailable'}</button><button class="btn btn-outline" type="button" data-unwish="${w.id}" aria-label="Remove ${esc(w.name)} from wishlist">${icon('heart',18).replace('fill="none"','fill="currentColor"')}</button></div></li>`).join('')}</ul>`:`<section class="card p-8 text-center" aria-labelledby="we"><span class="mx-auto grid h-14 w-14 place-items-center bg-[#f5f5f5] text-[#322783]" style="border-radius:4px">${icon('heart',28)}</span><h2 id="we" class="cond mt-3 text-[26px]">Nothing saved yet</h2><p class="mx-auto mt-1 max-w-md text-[#4d4d4d]">Tap the heart on any product to save it here for later.</p><a class="btn btn-primary mt-5" href="#shop" data-stub="Shop — not part of this mockup">Browse products</a></section>`}</div>`};
const TITLES={dashboard:['Dashboard',''],orders:['Orders','Track, review and reorder.'],addresses:['Addresses','Where we deliver.'],details:['Account details','Your profile and sign-in.'],wishlist:['Wishlist','Saved for later.']};
function render(){const v=view();const r=route();
 const cls='flex min-h-[44px] items-center gap-3 border-l-4 border-transparent px-4 py-2.5 font-bold text-[#4d4d4d] hover:bg-[#f5f5f5] hover:text-[#322783] [&.is-cur]:border-[#c4301c] [&.is-cur]:bg-[#f5f5f5] [&.is-cur]:text-[#322783]';
 const stripCls='flex min-h-[44px] shrink-0 items-center gap-2 border-b-4 border-transparent px-4 font-bold text-white/80 hover:text-white [&.is-cur]:border-[#c4301c] [&.is-cur]:text-white';
 const dash=r.tab==='dashboard';const od=r.order?`Order #${r.order}`:null;const [tt,sub]=TITLES[r.tab];
 const body=v.loading?loadingMain():(r.order?orderDetail(v,r.order):({dashboard:dashboardView,orders:ordersView,addresses:addressesView,details:detailsView,wishlist:wishlistView}[r.tab])(v));
 document.title=`${od||tt} · Belims account mockup (Option A)`;
 $('#app').innerHTML=`<section class="on-dark bg-[#1d1650] text-white"><div class="wrap pt-6 md:pt-9"><div class="flex flex-wrap items-end justify-between gap-4 pb-6"><div><p class="text-[12px] font-bold uppercase tracking-[.1em] text-white/70">My account</p><h1 id="h1" tabindex="-1" class="cond mt-1 text-[36px] md:text-[48px]">${dash?`Hi, ${esc(v.name)}`:esc(od||tt)}</h1>${!dash&&!od&&sub?`<p class="text-white/80">${sub}</p>`:''}</div><div class="flex flex-wrap items-center gap-3"><span class="badge" style="background:transparent;color:#fff;border-color:#fff">${icon(v.trade?'tool':'user',14)} ${v.trade?'Trade account':'Standard account'}</span><span class="text-[14px] text-white/80">${icon('pin',14)} Delivering to ${esc(v.addr.city)}, ${esc(v.addr.postalCode)}</span></div></div>
 <nav aria-label="Account" class="-mx-4 flex overflow-x-auto px-4 lg:hidden">${NAV.map(([i,l,ic])=>navLink(i,l,ic,v,stripCls)).join('')}<a href="#out" data-stub="Sign out — not part of this mockup" class="${stripCls}">${icon('out',18)}<span>Sign out</span></a></nav></div></section>
 <div class="wrap grid gap-8 py-6 md:py-8 lg:grid-cols-[232px_minmax(0,1fr)]">
 <nav aria-label="Account" class="hidden lg:block"><div class="card sticky top-4 overflow-hidden"><div class="flex flex-col py-2">${NAV.map(([i,l,ic])=>navLink(i,l,ic,v,cls)).join('')}<a href="#out" data-stub="Sign out — not part of this mockup" class="${cls} mt-2 border-t border-[#e5e5e5]">${icon('out',20)}<span>Sign out</span></a></div></div></nav>
 <main id="main" class="min-w-0">${body}<p class="mt-8 text-[13px] text-[#6b6b6b]">Mockup · no Payment methods tab (PayFast is redirect-only; saved cards don't exist).</p></main></div>`}
window.addEventListener('hashchange',()=>{LS.msg='';render();$('#h1')?.focus();window.scrollTo(0,0)});
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){LS.filter=f.dataset.filter;render();$(`[data-filter="${LS.filter}"]`).focus()}
 const d=e.target.closest('[data-default]');if(d){LS.defaultAddr=d.dataset.default;LS.msg=`${d.dataset.default==='shipping'?'Shipping':'Billing'} address is now your default.`;render();$('#addr-live').focus?.()}
 const u=e.target.closest('[data-unwish]');if(u){const w=DATA.wishlist.find(x=>x.id===u.dataset.unwish);LS.removed.add(u.dataset.unwish);LS.msg=`${w.name} removed from your wishlist.`;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='dform'){e.preventDefault();LS.msg='Your details have been saved.';render();$('#dform-live').scrollIntoView({block:'center'})}});

document.body.insertAdjacentHTML('afterbegin',siteBar());document.body.insertAdjacentHTML('beforeend',barHTML());syncBar();render();
</script></body></html>
