<!--
Option C — Trade / pro dashboard
Components: AccountShell (slim rail -> bottom tab bar), FulfilmentPreference, ActiveOrderBanner, TradePanel (contractor role), BuyAgainGrid, OrderHistory (expandable, per-item reorder).
New data/API: reorder endpoint / add-by-product-id with stock check; buy-again aggregation (client-side from orders, or a server endpoint for >50 orders); fulfilment preference stored in user meta; order detail route; trade quotes need a real API (shown as a stub).
Build effort: HIGH (buy-again + per-line reorder + preference sync; trade panel is content-only until finance data exists).
AUDIT items addressed: fake Account Balance removed (real counts only); recent-order rows are links; order detail on its own URL; wishlist add disabled when out of stock; ZAR + en-ZA dates; labelled/semantic nav with aria-current; one radius scale / button system / status-badge system; focus-visible + reduced-motion; mobile no longer stacks a 7-item sidebar above content.
Mock states: toggle bottom-right (Default / Loading / Empty / Trade) or ?state=. All data inlined from data.json (anonymised). No network calls; buttons only show a toast.
-->

const syncBar=()=>document.querySelectorAll('#statebar [data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.state===getState())));
const barHTML=()=>`<div id="statebar" role="group" aria-label="Mock state"><span>Mock</span>${STATES.map(s=>`<button type="button" data-state="${s}" aria-pressed="false">${s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div><div id="toast" role="status" aria-live="polite"></div>`;
const siteBar=()=>`<div class="bg-[#322783] text-white on-dark"><div class="wrap flex h-12 items-center justify-between"><span class="cond text-[22px]">Belims</span><span class="text-[12px] opacity-80">Site header unchanged · mock</span></div></div>`;

const PREF={mode:'delivery'};const QTY={};
const sideLink=(id,label,ic,v)=>{const cur=id==='dashboard';const b=id==='wishlist'&&v.wish.length?`<span class="absolute right-1.5 top-1.5 grid h-4 min-w-4 place-items-center rounded-sm bg-[#c4301c] px-1 text-[10px] font-bold text-white">${v.wish.length}</span>`:'';return `<a href="#${id}" ${cur?'aria-current="page"':`data-stub="${esc(label)} — not part of this mockup"`} class="relative flex min-h-[56px] flex-col items-center justify-center gap-1 border-l-4 px-1 text-center text-[11px] font-bold leading-tight ${cur?'border-[#c4301c] bg-white/10 text-white':'border-transparent text-white/75 hover:bg-white/10 hover:text-white'}">${icon(ic,22)}<span>${label}</span>${b}</a>`};
const tabLink=(id,label,ic,v)=>{const cur=id==='dashboard';const b=id==='wishlist'&&v.wish.length?`<span class="absolute right-[18%] top-1 grid h-4 min-w-4 place-items-center rounded-sm bg-[#c4301c] px-1 text-[10px] font-bold text-white">${v.wish.length}</span>`:'';return `<a href="#${id}" ${cur?'aria-current="page"':`data-stub="${esc(label)} — not part of this mockup"`} class="relative flex min-h-[56px] flex-1 flex-col items-center justify-center gap-0.5 border-t-4 px-1 text-center text-[11px] font-bold leading-tight ${cur?'border-[#c4301c] text-[#322783]':'border-transparent text-[#4d4d4d]'}">${icon(ic,22)}<span>${label}</span>${b}</a>`};
const pill=v=>`<div class="flex flex-wrap items-center gap-3"><div role="radiogroup" aria-label="Fulfilment preference" class="inline-flex border-2 border-[#322783]" style="border-radius:4px"><button type="button" role="radio" aria-checked="${PREF.mode==='delivery'}" data-seg="delivery" class="flex min-h-[44px] items-center gap-2 px-3 font-bold ${PREF.mode==='delivery'?'bg-[#322783] text-white':'bg-white text-[#322783]'}">${icon('truck',18)} Delivery</button><button type="button" role="radio" aria-checked="${PREF.mode==='collect'}" data-seg="collect" class="flex min-h-[44px] items-center gap-2 px-3 font-bold ${PREF.mode==='collect'?'bg-[#322783] text-white':'bg-white text-[#322783]'}">${icon('store',18)} Collect</button></div><p class="text-[14px] text-[#4d4d4d]" aria-live="polite">${PREF.mode==='delivery'?`Delivering to <strong class="text-black">${esc(addrLine(v.addr))}</strong>`:`Collecting from <strong class="text-black">${esc(DATA.store.name)}</strong> · ${esc(DATA.store.hours)}`}</p></div>`;
const cBanner=v=>{const o=v.focus;if(!o||!ACTIVE.includes(o.status))return '';const tr=o.tracking&&o.tracking[0];return `<section aria-labelledby="ab" class="card flex flex-wrap items-center gap-x-6 gap-y-3 border-l-4 !border-l-[#322783] p-4"><div class="min-w-0 flex-1"><h2 id="ab" class="font-bold">Order #${esc(o.order_number)} <span class="ml-1">${badge(o.status)}</span></h2><p class="truncate text-[14px] text-[#4d4d4d]">${itemsSummary(o)}${tr?` · ${esc(tr.courier)} ${esc(tr.tracking_number)} · ${esc(tr.status)}`:''}</p></div><div class="w-full max-w-[420px] md:w-[360px]">${stepper(o)}</div><a class="btn btn-primary" href="#t" data-stub="${tr?`Opens /track-order?order-number=${esc(tr.tracking_number)}`:`Opens /account/orders/${esc(o.order_number)} (new route)`}">${tr?'Track':'View'}</a></section>`};
const cTrade=()=>`<section aria-labelledby="tp" class="on-dark overflow-hidden bg-[#322783] text-white" style="border-radius:4px"><div class="flex flex-wrap items-center justify-between gap-4 p-5"><div class="flex items-start gap-3">${icon('tool',26)}<div><h2 id="tp" class="cond text-[22px]">Trade account</h2><p class="max-w-xl text-[14px] text-white/85">Trade pricing applies automatically to trade-special products while you're signed in. Prices on this page are retail; trade prices show on the product page.</p></div></div><div class="flex flex-wrap gap-3"><a class="btn btn-inverse" href="#td" data-stub="Opens trade deals">Trade deals</a><a class="btn btn-inverse" href="#tq" data-stub="Quote requests — new feature, needs an API">Request a quote</a></div></div></section>`;
const cBuy=v=>{const list=buyAgain(v.orders).slice(0,8);const h=`<div class="flex flex-wrap items-end justify-between gap-2"><div><p class="eyebrow">From your orders</p><h2 id="ba" class="cond text-[26px]">Buy again</h2></div></div>`;
 if(!list.length)return `<section aria-labelledby="ba">${h}<div class="card mt-3 p-6 text-[#4d4d4d]"><p>Your buy-again list builds from your orders — the things you buy most appear here for one-tap reordering.</p><a class="btn btn-primary mt-4" href="#s" data-stub="Shop — not part of this mockup">Browse products</a></div></section>`;
 return `<section aria-labelledby="ba">${h}<ul class="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2 xl:grid-cols-4">${list.map(p=>{const q=QTY[p.id]||1;return `<li class="card flex flex-col gap-3 p-4"><div class="grid h-20 place-items-center bg-[#f5f5f5] text-[#6b6b6b]" style="border-radius:4px">${icon('tool',32)}</div><div class="min-w-0 flex-1"><p class="line-clamp-2 font-bold leading-snug">${esc(p.name)}</p><p class="text-[13px] text-[#4d4d4d]">Bought ${p.count}× · last ${fdate(p.last)}</p></div><p class="text-[18px] font-bold">${money(p.price)}</p><div class="flex gap-2"><div class="flex items-center border border-[#d4d4d4]" style="border-radius:4px" role="group" aria-label="Quantity for ${esc(p.name)}"><button type="button" class="grid h-11 w-11 place-items-center hover:text-[#c4301c] disabled:opacity-40" data-qty="${p.id}" data-d="-1" aria-label="Decrease quantity" ${q<=1?'disabled':''}>${icon('minus',16)}</button><output class="w-6 text-center font-bold">${q}</output><button type="button" class="grid h-11 w-11 place-items-center hover:text-[#c4301c]" data-qty="${p.id}" data-d="1" aria-label="Increase quantity">${icon('plus',16)}</button></div><button class="btn btn-primary flex-1" type="button" data-add="${q} × ${esc(p.name)}">Add</button></div></li>`}).join('')}</ul></section>`};
const cHist=v=>{if(!v.orders.length)return '';return `<section aria-labelledby="oh"><div class="flex items-end justify-between"><h2 id="oh" class="cond text-[26px]">Order history</h2><a class="btn-text" href="#orders" data-stub="Orders list — not part of this mockup">View all</a></div><div class="mt-3 divide-y divide-[#e5e5e5] border border-[#e5e5e5]" style="border-radius:4px">${v.orders.slice(0,5).map((o,i)=>`<details class="group bg-white" ${i===0?'open':''}><summary class="flex min-h-[64px] cursor-pointer list-none flex-wrap items-center gap-x-4 gap-y-1 px-4 py-3 hover:bg-[#f5f5f5] [&::-webkit-details-marker]:hidden"><span class="font-bold">#${o.order_number}</span><span class="text-[14px] text-[#4d4d4d]">${fdate(o.date_created)}</span><span class="hidden md:inline">${badge(o.status)}</span><span class="ml-auto text-[14px] text-[#4d4d4d]">${itemCount(o)} item${itemCount(o)>1?'s':''}</span><span class="w-24 text-right font-bold">${money(o.total)}</span><span class="text-[#6b6b6b] transition-transform group-open:rotate-90">${icon('chev',18)}</span></summary><div class="border-t border-[#e5e5e5] bg-[#fafafa] px-4 py-3"><p class="mb-2 md:hidden">${badge(o.status)}</p><ul class="divide-y divide-[#e5e5e5]">${o.line_items.map(l=>`<li class="flex items-center gap-3 py-2"><span class="min-w-0 flex-1"><span class="block truncate font-semibold">${esc(l.name)}</span><span class="text-[13px] text-[#4d4d4d]">${l.quantity} × ${money(l.price)}</span></span><button class="btn btn-outline !min-h-[44px] !px-3" type="button" data-add="${l.quantity} × ${esc(l.name)}" aria-label="Add ${esc(l.name)} to cart">Add</button></li>`).join('')}</ul><div class="mt-3 flex flex-wrap gap-3"><button class="btn btn-primary" type="button" data-add="all ${itemCount(o)} items from #${o.order_number}">${icon('refresh',18)} Reorder all</button><a class="btn btn-outline" href="#o" data-stub="Opens /account/orders/${o.order_number} (new route)">View order</a>${o.tracking&&o.tracking[0]?`<a class="btn-text" href="#t" data-stub="Opens /track-order?order-number=${esc(o.tracking[0].tracking_number)}">Track ${esc(o.tracking[0].tracking_number)}</a>`:''}</div></div></details>`).join('')}</div></section>`};
const cLoading=()=>`<div class="space-y-6" aria-busy="true" aria-label="Loading your account">${skel(76)}<div class="grid grid-cols-2 gap-3 xl:grid-cols-4">${[1,2,3,4].map(()=>`<div class="card p-4 space-y-3">${skel(80)}${skel(16)}${skel(44)}</div>`).join('')}</div><div class="card p-4 space-y-3">${skel(20)}${skel(20)}${skel(20)}</div></div>`;
function render(){const v=view();
 $('#app').innerHTML=`<div class="lg:grid lg:grid-cols-[88px_minmax(0,1fr)]">
 <nav aria-label="Account" class="on-dark hidden bg-[#322783] lg:block"><div class="sticky top-0 flex flex-col py-3">${NAV.map(([i,l,ic])=>sideLink(i,l,ic,v)).join('')}<a href="#out" data-stub="Sign out — not part of this mockup" class="mt-2 flex min-h-[56px] flex-col items-center justify-center gap-1 border-l-4 border-transparent px-1 text-[11px] font-bold text-white/75 hover:bg-white/10 hover:text-white">${icon('out',22)}<span>Sign out</span></a></div></nav>
 <nav aria-label="Account" class="fixed inset-x-0 bottom-0 z-40 flex border-t border-[#d4d4d4] bg-white pb-[env(safe-area-inset-bottom)] lg:hidden">${NAV.map(([i,l,ic])=>tabLink(i,l.replace('Account details','Details'),ic,v)).join('')}</nav>
 <main id="main" class="min-w-0 px-4 pb-28 pt-6 md:px-8 lg:pb-10"><div class="mx-auto max-w-[1180px]"><div class="flex flex-wrap items-end justify-between gap-4 pb-5"><div><p class="eyebrow">${v.trade?'Trade account':'My account'}</p><h1 class="cond mt-1 text-[34px] md:text-[44px]">Hi, ${esc(v.name)}</h1></div>${v.loading?skel(44,'320px'):pill(v)}</div>
 ${v.loading?cLoading():`<div class="space-y-8">${cBanner(v)}${v.trade?cTrade():''}${cBuy(v)}${cHist(v)}</div>`}
 <p class="mt-8 text-[13px] text-[#6b6b6b]">Mockup · Payment methods tab removed (see AUDIT). Delivery/Collect preference would persist to user meta (new).</p></div></main></div>`}
document.addEventListener('click',e=>{const s=e.target.closest('[data-seg]');if(s){PREF.mode=s.dataset.seg;render();$(`[data-seg="${PREF.mode}"]`).focus()}const q=e.target.closest('[data-qty]');if(q){const id=q.dataset.qty;QTY[id]=Math.max(1,(QTY[id]||1)+ +q.dataset.d);render();$(`[data-qty="${id}"][data-d="${q.dataset.d}"]`)?.focus()}});

document.body.insertAdjacentHTML('afterbegin',siteBar());document.body.insertAdjacentHTML('beforeend',barHTML());syncBar();render();
</script></body></html>
