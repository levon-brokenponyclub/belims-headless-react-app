name: Deploy WordPress to Cloudways

on:
  push:
    branches: [main]
    paths:
      - "wp-content/plugins/belims-**"
      - "wp-content/plugins/uafrica-shipping/**"
      - "wp-config.php"
      - ".github/workflows/deploy-cloudways.yml"

jobs:
  deploy:
    name: Deploy to Cloudways Staging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get changed files
        id: changed-files
        run: |
          echo "Changed files:"
          git diff --name-only HEAD^..HEAD
          echo "files=$(git diff --name-only HEAD^..HEAD | tr '\n' ' ')" >> $GITHUB_OUTPUT

      - name: Deploy Belims Headless API Plugin
        if: contains(steps.changed-files.outputs.files, 'wp-content/plugins/belims-headless-api')
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: wp-content/plugins/belims-headless-api/
          remote_path: /public_html/wp-content/plugins/belims-headless-api/
          remote_host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          remote_user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          remote_password: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          remote_port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}

      - name: Deploy Belims Site Settings Plugin
        if: contains(steps.changed-files.outputs.files, 'wp-content/plugins/belims-custom-site-settings')
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: wp-content/plugins/belims-custom-site-settings/
          remote_path: /public_html/wp-content/plugins/belims-custom-site-settings/
          remote_host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          remote_user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          remote_password: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          remote_port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}

      - name: Deploy uAfrica Shipping Plugin
        if: contains(steps.changed-files.outputs.files, 'wp-content/plugins/uafrica-shipping')
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: wp-content/plugins/uafrica-shipping/
          remote_path: /public_html/wp-content/plugins/uafrica-shipping/
          remote_host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          remote_user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          remote_password: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          remote_port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}

      - name: Deploy wp-config.php
        if: contains(steps.changed-files.outputs.files, 'wp-config.php')
        uses: Burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz
          path: wp-config.php
          remote_path: /public_html/wp-config.php
          remote_host: ${{ secrets.CLOUDWAYS_SFTP_HOST }}
          remote_user: ${{ secrets.CLOUDWAYS_SFTP_USER }}
          remote_password: ${{ secrets.CLOUDWAYS_SFTP_PASSWORD }}
          remote_port: ${{ secrets.CLOUDWAYS_SFTP_PORT }}

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌍 Site: https://wordpress-1482444-6163809.cloudwaysapps.com"
          echo "📦 Deployed plugins:"
          echo "${{ steps.changed-files.outputs.files }}" | grep "wp-content/plugins" || echo "No plugin changes"
